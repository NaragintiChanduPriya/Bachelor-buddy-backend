[project]
name = "bachelorbuddy-backend"
version = "0.1.0"
description = "FastAPI + PostgreSQL backend and AI agents for BachelorBuddy"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "faker>=40.44.0",
    "fastapi>=0.162.2",
    "groq>=1.7.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
# This is an application, not a library: run it from the project root, don't install it.
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit (security)
  "SIM",           # simplify
  "C4",            # comprehensions
  "RUF",           # ruff-specific
  "ASYNC",         # async pitfalls
  "DTZ",           # timezone-aware datetimes only
  "PT",            # pytest style
  "N",             # naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018", "E501"]  # asserts, fake secrets and long expected values
"migrations/versions/**" = ["E501"]    # autogenerated DDL can run long
"scripts/**" = ["T201"]                # the scripts talk to the user with print()
"scripts/e2e_db.py" = ["T201", "E501"]  # one cleanup statement per line
"scripts/seed/**" = ["E501", "S311"]
"app/agents/{tools,rules,prompts,personal}.py" = ["E501"]
"app/scheduler/{jobs,__main__}.py" = ["E501"]  # tool tables and reply templates read best unwrapped   # data tables read best one row per line; seeded RNG is the point

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "migrations", "tests"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
  "db: needs the local test database (created by scripts/setup_db.py); skipped when unreachable",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs code in greenlets; without this, lines after awaits look unrun.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
